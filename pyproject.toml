[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "tracelane"
version = "0.1.0"
description = "A trace-first evaluation harness for evidence-grounded, long-running agents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Yifan Yang"}]
dependencies = ["jsonschema>=4.22,<5"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
tracelane = "tracelane.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tracelane"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures/v0.1" = "tracelane/fixtures/v0.1"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
